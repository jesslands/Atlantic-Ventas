services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlantic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlantic}
      POSTGRES_DB: ${POSTGRES_DB:-atlantic}
    ports:
      # Solo loopback (PT-08 en investigacion/Pentesting.md): el servicio "app"
      # llega a "db" por la red interna de compose sin pasar por este puerto
      # publicado; abrirlo a 0.0.0.0 solo hace falta si algo FUERA del host
      # necesita de verdad la base.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlantic} -d ${POSTGRES_DB:-atlantic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-atlantic}:${POSTGRES_PASSWORD:-atlantic}@db:5432/${POSTGRES_DB:-atlantic}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
